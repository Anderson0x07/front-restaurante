<div class="layout-topbar">
    <a class="layout-topbar-logo" routerLink="">
        <img [src]="urlLogo" alt="logo">
    </a>

    <ng-container *ngIf="usuario.rol && usuario.rol?.nombre != 'MESERO'">
        <button #menubutton class="p-link layout-menu-button layout-topbar-button" (click)="layoutService.onMenuToggle()">
            <i class="pi pi-bars"></i>
        </button>
    </ng-container>

    <button #topbarmenubutton class="p-link layout-topbar-menu-button layout-topbar-button" (click)="layoutService.showProfileSidebar()">
        
        <p-avatar [image]="url + (usuario.imagen === '' || !usuario.imagen ? 'default-profile' :  usuario.imagen)" styleClass="cursor-pointer" 
            size="large" shape="circle">
        </p-avatar>
    </button>
    <div #topbarmenu class="layout-topbar-menu" [ngClass]="{'layout-topbar-menu-mobile-active': layoutService.state.profileSidebarVisible}">

        <!-- <button class="p-link layout-topbar-button" [routerLink]="rol == 'MESERO' ? '/mesero/mi-perfil' : '/admin/mi-perfil'">
            <i class="pi pi-user"></i>
            <span>Mi Perfil</span>
        </button> -->
        <button class="p-link layout-topbar-button" (click)="cerrarSesion()">
            <i class="pi pi-power-off"></i>
            <span>Cerrar sesión</span>
        </button> 
    </div>
</div>
